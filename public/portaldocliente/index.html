<!doctype html><html><head><meta charset=utf8><base href="/portaldocliente/"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portal do Cliente</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="ux-v2.css">
<link rel="stylesheet" href="ux-neu.css">
<link rel="stylesheet" href="ux-motion.css">
<link rel="stylesheet" href="ux-neon.css">
<link rel="stylesheet" href="ux-ajustes.css">
<link rel="stylesheet" href="ux-organico.css">
<link rel="stylesheet" href="ux-emergir.css">
<script>try{var t=localStorage.getItem("ce-tema");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>
<style>
  /* Selo pequeno da visão (Cliente / Escritório), flutuando no rodapé */
  body { background: var(--neu-bg); color: var(--neu-text); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .demo-bar { position: fixed; left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 50; pointer-events: none; opacity: .85; }
  .demo-bar .demo-visao { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: var(--neu-bg); color: var(--neu-text-soft); box-shadow: var(--neu-out-sm); }
  .demo-bar .demo-visao.escritorio { color: var(--neu-accent); }
  .logo-ce { user-select: none; -webkit-user-select: none; }
</style>

<div id="root"></div>
<div id="modal-root"></div>

<div class="demo-bar" aria-live="polite">
  <span class="demo-visao" id="demoVisao"></span>
</div>

<script src="mock-browser.js"></script>
<script src="app.js"></script>
<script>
  // Atalho escondido: dois cliques na logo alternam entre a visão do cliente e a do escritório.
  (function () {
    var visao = document.getElementById("demoVisao");
    var atual = (window.CE_DEMO && window.CE_DEMO.perfil()) || "cliente";
    visao.textContent = "Visão: " + (atual === "escritorio" ? "Escritório" : "Cliente");
    visao.classList.toggle("escritorio", atual === "escritorio");
    document.addEventListener("dblclick", function (e) {
      if (!e.target.closest || !e.target.closest(".logo-ce") || !window.CE_DEMO) return;
      e.preventDefault();
      try { window.getSelection().removeAllRanges(); } catch (x) {}
      window.CE_DEMO.setPerfil(atual === "escritorio" ? "cliente" : "escritorio");
    });
  })();
</script>


</body></html>

# Publicação por FTP na Hostgator. Só roda manualmente:
#   Actions > "Publicar na Hostgator (FTP)" > Run workflow
# Precisa dos secrets em Settings > Secrets and variables > Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  (e opcionalmente FTP_REMOTE_DIR, padrão ./public_html/)
#   APRESENTACAO_PIN  (senha da página /apresentacao; só números). Vai para o servidor como sal + HMAC,
#                     nunca em texto puro e nunca no repositório.
#
# Modo "simular" (padrão): conecta no FTP e só LISTA o que seria enviado, sem gravar nada.
# Modo "enviar": grava os arquivos. Exige digitar PUBLICAR.
#
# Enviar os arquivos NÃO troca o site no ar: o domínio continua apontando para a Lovable
# até alguém mudar os registros A no DNS (ver README). Antes dessa troca, resolver a Auditoria Fiscal.
name: Publicar na Hostgator (FTP)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'simular = só lista o que seria enviado; enviar = grava no servidor'
        type: choice
        options: [simular, enviar]
        default: simular
      confirmar:
        description: 'Para o modo enviar, digite PUBLICAR'
        required: false

jobs:
  deploy:
    if: ${{ inputs.modo == 'simular' || inputs.confirmar == 'PUBLICAR' }}
    runs-on: ubuntu-latest
    concurrency: deploy-hostgator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Senha da apresentação (gera apresentacao-portao-config.php a partir do secret)
        env:
          PIN: ${{ secrets.APRESENTACAO_PIN }}
          MODO: ${{ inputs.modo }}
        run: |
          if [ -z "$PIN" ]; then
            if [ "$MODO" = "enviar" ]; then echo "::error::Falta o secret APRESENTACAO_PIN (senha da apresentação)."; exit 1; fi
            echo "::warning::Sem APRESENTACAO_PIN: na simulação segue sem a senha (o portão ficaria fechado)."; exit 0
          fi
          node -e '
            const c = require("crypto"); const sal = c.randomBytes(16).toString("hex");
            const pin = process.env.PIN.replace(/\D/g, "");
            const hash = c.createHmac("sha256", sal).update(pin).digest("hex");
            require("fs").writeFileSync("dist/apresentacao-portao-config.php", `<?php return ["sal" => "${sal}", "hash" => "${hash}"];
`);
          '
          echo "Senha da apresentação configurada."
      - name: ${{ inputs.modo == 'enviar' && 'Enviar dist/ por FTP' || 'Simular envio (nada é gravado)' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR || './public_html/' }}
          dry-run: ${{ inputs.modo != 'enviar' }}
          log-level: verbose
